<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>agents-portal</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <strong>agents-portal</strong>
        <button id="add-host" title="Add host">+ host</button>
      </header>
      <ul id="hosts"></ul>
    </aside>
    <main id="main">
      <div id="topbar" hidden>
        <span id="session-label"></span>
        <span class="spacer"></span>
        <button data-view="chat" class="active">Chat</button>
        <button data-view="term">Terminal</button>
      </div>

      <div id="chat" hidden></div>
      <div id="terminal" hidden></div>
      <div id="placeholder">Pick a session.</div>

      <form id="chatinput" hidden>
        <textarea id="chatbox" rows="1" placeholder="Message the agent…"></textarea>
        <button type="submit">Send</button>
      </form>
      <nav id="toolbar" hidden>
        <button data-key="esc">Esc</button>
        <button data-key="tab">Tab</button>
        <button data-key="ctrlc">^C</button>
        <button data-key="up">↑</button>
        <button data-key="down">↓</button>
        <button data-key="left">←</button>
        <button data-key="right">→</button>
        <button data-key="pageup">⤒</button>
        <button data-key="pagedown">⤓</button>
      </nav>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
