<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>agents-portal</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <button id="menu-toggle" aria-label="Toggle sessions menu">☰</button>
    <div id="backdrop"></div>

    <aside id="sidebar">
      <ul id="hosts"></ul>
    </aside>
    <main id="main">
      <div id="chat" hidden></div>
      <div id="placeholder">Pick a session.</div>

      <form id="chatinput" hidden>
        <textarea id="chatbox" rows="1" placeholder="Message the agent…"></textarea>
        <button type="submit">Send</button>
      </form>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
